# =============================================================
# MonTour — pubspec.yaml
# Configuration du projet Flutter
# =============================================================

name: montour
description: Application mobile intelligente de gestion des files d'attente — Bénin
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Navigation ──────────────────────────────────────────────
  go_router: ^13.0.0              # Routage déclaratif

  # ── Gestion d'état ─────────────────────────────────────────
  flutter_riverpod: ^2.4.0        # State management (provider pattern)
  riverpod_annotation: ^2.3.0

  # ── HTTP / API ──────────────────────────────────────────────
  dio: ^5.4.0                     # Client HTTP avec intercepteurs
  retrofit: ^4.1.0                # Génération d'API clients

  # ── Authentification ────────────────────────────────────────
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  google_sign_in: ^6.2.0

  # ── Notifications push ──────────────────────────────────────
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^16.3.0

  # ── Stockage local ──────────────────────────────────────────
  flutter_secure_storage: ^9.0.0  # JWT tokens sécurisés
  shared_preferences: ^2.2.2      # Préférences légères
  hive_flutter: ^1.1.0            # Cache offline (NoSQL léger)

  # ── IA / ML ─────────────────────────────────────────────────
  tflite_flutter: ^0.10.4         # TensorFlow Lite embarqué

  # ── UI / Design ─────────────────────────────────────────────
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0                 # Skeleton loading
  lottie: ^3.0.0                  # Animations Lottie
  fl_chart: ^0.66.0               # Graphiques et statistiques
  animate_do: ^3.3.4              # Animations UI simples
  pull_to_refresh: ^2.0.0
  badges: ^3.1.2                   # Badge de notification

  # ── Utilitaires ─────────────────────────────────────────────
  intl: ^0.19.0                   # Internationalisation / dates
  timeago: ^3.6.1                 # "il y a 5 minutes"
  url_launcher: ^6.2.4
  package_info_plus: ^5.0.1
  connectivity_plus: ^5.0.2       # Détection connexion réseau
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  retrofit_generator: ^8.1.0
  json_serializable: ^6.7.1
  freezed: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/models/                # Modèles TFLite
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800