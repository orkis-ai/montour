<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MonTour — Gestion Intelligente des Files d'Attente par IA (Ségbana, Bénin)</title>
  <meta name="description"
    content="MonTour — Application de gestion intelligente des files d'attente par IA à Ségbana, Bénin.">

  <!-- PWA : installation sur tout terminal (Android, iOS, Desktop) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="background-color" content="#0f172a">

  <!-- iOS : Ajouter à l'écran d'accueil -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MonTour">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">

  <!-- Android / Chrome -->
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/icons/icon-512.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- React 18 & ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #1e293b;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* Container global : adapte l'application à TOUT écran (mobile, tablette, desktop) */
    #root-wrapper {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(0px, 3vw, 28px);
      box-sizing: border-box;
    }

    /* Le "cadre" imite un smartphone sur grand écran, mais devient plein écran
       sur mobile et disparaît totalement une fois l'app installée (mode standalone) */
    .mobile-frame {
      width: 100%;
      max-width: 430px;
      height: 100%;
      max-height: min(930px, 96vh);
      background: #f8fafc;
      border-radius: 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 12px #1e293b;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: max-width 0.2s ease;
    }

    /* Tablette : un peu plus large pour profiter de l'espace disponible */
    @media (min-width: 601px) and (max-width: 1024px) {
      .mobile-frame {
        max-width: 500px;
        max-height: min(880px, 92vh);
      }
    }

    /* Grand écran / desktop : cadre confortable, jamais écrasé ni étiré */
    @media (min-width: 1025px) {
      .mobile-frame {
        max-width: 460px;
      }
    }

    /* Mobile : application plein écran, sans cadre ni marge */
    @media (max-width: 600px) {
      #root-wrapper {
        padding: 0;
      }

      .mobile-frame {
        max-width: 100%;
        max-height: 100vh;
        max-height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* Une fois installée comme app (PWA), on retire le cadre "téléphone" sur tous
       les terminaux : elle occupe alors tout l'écran comme une app native */
    @media (display-mode: standalone),
    (display-mode: fullscreen),
    (display-mode: minimal-ui) {
      #root-wrapper {
        padding: 0;
      }

      .mobile-frame {
        max-width: 100%;
        max-height: 100%;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* Support des encoches / zones sûres (iPhone notch, barres Android) */
    .mobile-frame {
      padding-top: env(safe-area-inset-top);
    }

    /* Scrollbar personnalisée */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.03);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.25);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div id="root-wrapper">
    <div class="mobile-frame" id="root"></div>
  </div>

  <!-- PWA : enregistrement du Service Worker + capture de l'invite d'installation -->
  <script>
    window.__mtDeferredInstallPrompt = null;
    window.__mtIsStandalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.__mtDeferredInstallPrompt = e;
      window.dispatchEvent(new CustomEvent('mt-install-available'));
    });

    window.addEventListener('appinstalled', () => {
      window.__mtDeferredInstallPrompt = null;
      window.dispatchEvent(new CustomEvent('mt-install-done'));
    });

    window.__mtTriggerInstall = async () => {
      const promptEvent = window.__mtDeferredInstallPrompt;
      if (!promptEvent) return { outcome: 'unavailable' };
      promptEvent.prompt();
      const choice = await promptEvent.userChoice;
      window.__mtDeferredInstallPrompt = null;
      return choice;
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {
          /* L'app fonctionne normalement même si le Service Worker échoue à s'enregistrer
             (par ex. en local via file://) */
        });
      });
    }
  </script>

  <script type="text/babel">
    {% verbatim %}
    const { useState, useEffect, useRef, useCallback } = React;

    // ============================================================
    // DATABASE LOCAL & ENPOINTS REST (FALLBACK HYBRIDE)
    // ============================================================
    const localDB = {
      users: JSON.parse(localStorage.getItem("mt_users") || "[]"),
      tickets: JSON.parse(localStorage.getItem("mt_tickets") || "[]"),
      queues: JSON.parse(localStorage.getItem("mt_queues") || "{}"),
      notifications: JSON.parse(localStorage.getItem("mt_notifs") || "{}"),

    const saveDB = () => {
      localStorage.setItem("mt_users", JSON.stringify(localDB.users));
      localStorage.setItem("mt_tickets", JSON.stringify(localDB.tickets));
      localStorage.setItem("mt_queues", JSON.stringify(localDB.queues));
      localStorage.setItem("mt_notifs", JSON.stringify(localDB.notifications));
    };

    const SERVICES = [
      { id: "svc-1", name: "Centre de Santé de Ségbana 🏥", category: "Santé", description: "Consultations médicales & urgences", icon: "🏥", color: "#ef4444", avgServiceTime: 12, address: "Quartier Administratif, Ségbana" },
      { id: "svc-2", name: "Guichet Administratif (Mairie) 🏛️", category: "Administration", description: "Actes d'état civil & papiers", icon: "🏛️", color: "#3b82f6", avgServiceTime: 8, address: "Mairie de Ségbana" },
      { id: "svc-3", name: "Agence PEBCO Ségbana 🏦", category: "Microfinance", description: "Épargne, crédits & transferts", icon: "🏦", color: "#10b981", avgServiceTime: 10, address: "Avenue du Marché, Ségbana" },
      { id: "svc-4", name: "ATDA Pôle 4 Ségbana 🌾", category: "Agriculture", description: "Appui aux producteurs agricoles", icon: "🌾", color: "#f59e0b", avgServiceTime: 15, address: "Zone Agricole ATDA, Ségbana" },
    ];

    SERVICES.forEach(s => {
      if (!localDB.queues[s.id]) {
        localDB.queues[s.id] = { tickets: [], status: "open", currentNumber: 0, calledNumber: 0 };
      }
    });

    // Moteur d'estimation IA (TensorFlow Lite simulé)
    function predictWaitTime(serviceId, positionInQueue, userPriority) {
      const service = SERVICES.find(s => s.id === serviceId);
      if (!service) return 0;
      const base = service.avgServiceTime;
      const hour = new Date().getHours();
      let peakFactor = 1.0;
      if (hour >= 8 && hour <= 10) peakFactor = 1.5;
      else if (hour >= 11 && hour <= 13) peakFactor = 1.3;
      else if (hour >= 15 && hour <= 17) peakFactor = 1.4;
      const pMap = { urgent: 0.3, handicap: 0.5, senior: 0.7, normal: 1.0 };
      const effectivePos = Math.max(1, positionInQueue * (pMap[userPriority] || 1.0));
      const estimated = Math.round(effectivePos * base * peakFactor);
      const noise = 1 + (Math.random() * 0.2 - 0.1);
      return Math.max(1, Math.round(estimated * noise));
    }

    function computePriorityScore(priority, requestedAt) {
      const scores = { urgent: 100, handicap: 80, senior: 60, normal: 40 };
      const base = scores[priority] || 40;
      const waitedMin = (Date.now() - new Date(requestedAt).getTime()) / 60000;
      return base + Math.floor(waitedMin);
    }

    // Chatbot Rasa KB Fallback
    const CHATBOT_KB = {
      bonjour: "Bonjour ! Je suis l'assistant MonTour 🤖. Je peux vous aider à prendre un ticket, consulter le temps d'attente ou trouver un service à Ségbana.",
      ticket: "Pour réserver un ticket 🎫, allez dans **File d'attente**, choisissez un service (Santé, Mairie, PEBCO, ATDA) et appuyez sur **Prendre un ticket**.",
      attente: "Le temps d'attente ⏱️ est calculé en temps réel par notre moteur d'IA selon l'affluence, l'heure et votre niveau de priorité.",
      annuler: "Pour annuler votre ticket, allez dans **Tickets** et appuyez sur **Annuler**. Votre place sera libérée immédiatement.",
      priorité: "Niveaux de priorité 🏷️ : Urgent (Urgence médicale), Handicap (PMR), Senior (60+ ans) et Normal. Modifiez votre profil si nécessaire.",
      notification: "Activez les notifications 🔔 pour être averti instantanément au guichet !",
      horaire: "Les services à Ségbana sont ouverts du Lundi au Vendredi (08h00 - 17h00) et le Samedi matin (08h00 - 12h00).",
      aide: "Mots-clés suggérés : ticket, attente, annuler, priorité, notification, horaire, service.",
    };

    function getChatbotResponse(msg) {
      const lower = msg.toLowerCase();
      for (const [key, val] of Object.entries(CHATBOT_KB)) {
        if (lower.includes(key)) return val;
      }
      return "Je n'ai pas bien compris. Essayez des mots-clés comme : **ticket**, **attente**, **annuler**, **priorité** ou **horaire**.";
    }

    // Styles Globaux
    const COLORS = {
      primary: "#2563eb",
      primaryDark: "#1d4ed8",
      secondary: "#10b981",
      accent: "#f59e0b",
      danger: "#ef4444",
      bg: "#f8fafc",
      card: "#ffffff",
      text: "#0f172a",
      textLight: "#64748b",
      border: "#e2e8f0",
    };

    const S = {
      app: { fontFamily: "'Plus Jakarta Sans', sans-serif", background: COLORS.bg, height: "100%", width: "100%", position: "relative", display: "flex", flexDirection: "column", overflow: "hidden" },
      card: { background: "#fff", borderRadius: 20, padding: "18px 20px", boxShadow: "0 4px 20px -4px rgba(0,0,0,0.06)", marginBottom: 14, border: `1px solid ${COLORS.border}` },
      btn: (color = COLORS.primary) => ({ background: `linear-gradient(135deg, ${color}, ${color}dd)`, color: "#fff", border: "none", borderRadius: 14, padding: "14px 20px", fontSize: 15, fontWeight: 700, cursor: "pointer", width: "100%", boxShadow: `0 4px 14px ${color}40`, transition: "transform 0.15s, opacity 0.15s", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }),
      btnOutline: (color = COLORS.primary) => ({ background: "transparent", color, border: `2px solid ${color}`, borderRadius: 14, padding: "12px 20px", fontSize: 14, fontWeight: 700, cursor: "pointer", width: "100%", transition: "all 0.15s" }),
      input: { width: "100%", padding: "14px 16px", borderRadius: 14, border: `1.5px solid ${COLORS.border}`, fontSize: 15, outline: "none", boxSizing: "border-box", background: "#f8fafc", color: COLORS.text, fontWeight: 500 },
      label: { fontSize: 13, fontWeight: 700, color: COLORS.textLight, marginBottom: 6, display: "block" },
      badge: (color) => ({ background: color + "18", color, padding: "4px 12px", borderRadius: 30, fontSize: 12, fontWeight: 800 }),
      navBar: { flexShrink: 0, position: "relative", background: "rgba(255, 255, 255, 0.95)", backdropFilter: "blur(12px)", borderTop: `1px solid ${COLORS.border}`, display: "flex", zIndex: 1000, padding: "6px 0 calc(10px + env(safe-area-inset-bottom))" },
      navItem: (active) => ({ flex: 1, minWidth: 0, padding: "8px 2px", display: "flex", flexDirection: "column", alignItems: "center", cursor: "pointer", color: active ? COLORS.primary : COLORS.textLight, background: "none", border: "none", fontWeight: active ? 700 : 500 }),
    };

    // Toast Component
    function Toast({ msg, type, onClose }) {
      useEffect(() => { if (msg) { const t = setTimeout(onClose, 3500); return () => clearTimeout(t); } }, [msg]);
      if (!msg) return null;
      const bg = type === "error" ? COLORS.danger : type === "success" ? COLORS.secondary : COLORS.primary;
      return (
        <div style={{ position: "absolute", top: 16, left: 16, right: 16, background: bg, color: "#fff", padding: "14px 20px", borderRadius: 16, fontWeight: 700, zIndex: 9999, boxShadow: "0 10px 25px -5px rgba(0,0,0,0.2)", textAlign: "center", fontSize: 14, animation: "fadeIn 0.3s" }}>
          {msg}
        </div>
      );
    }

    function PriorityBadge({ p }) {
      const map = { urgent: ["🚨 Urgence Médicale", "#ef4444"], handicap: ["♿ Personne Handicapée", "#8b5cf6"], senior: ["👴 Senior (60+)", "#f59e0b"], normal: ["👤 Usager Normal", "#10b981"] };
      const [label, color] = map[p] || map.normal;
      return <span style={S.badge(color)}>{label}</span>;
    }

    // Détecte iOS (où l'installation se fait manuellement via le bouton "Partager")
    function isIOS() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    }

    // Bouton "Installer l'application" — fonctionne sur Android/Chrome/Edge/Desktop,
    // et affiche les instructions manuelles sur iOS/Safari (où l'API n'existe pas)
    function InstallAppButton({ showToast }) {
      const [canInstall, setCanInstall] = useState(!!window.__mtDeferredInstallPrompt);
      const [installed, setInstalled] = useState(!!window.__mtIsStandalone);
      const [showIOSHelp, setShowIOSHelp] = useState(false);

      useEffect(() => {
        const onAvailable = () => setCanInstall(true);
        const onDone = () => { setInstalled(true); setCanInstall(false); };
        window.addEventListener("mt-install-available", onAvailable);
        window.addEventListener("mt-install-done", onDone);
        return () => {
          window.removeEventListener("mt-install-available", onAvailable);
          window.removeEventListener("mt-install-done", onDone);
        };
      }, []);

      if (installed) {
        return (
          <div style={{ ...S.card, textAlign: "center", background: "#f0fdf4", border: "1.5px solid #10b981" }}>
            <span style={{ fontSize: 13, fontWeight: 800, color: "#047857" }}>✅ Application installée sur cet appareil</span>
          </div>
        );
      }

      const handleClick = async () => {
        if (isIOS()) { setShowIOSHelp(true); return; }
        if (!window.__mtDeferredInstallPrompt) {
          showToast && showToast("Utilisez le menu de votre navigateur (⋮) puis \"Installer l'application\"", "info");
          return;
        }
        const choice = await window.__mtTriggerInstall();
        if (choice.outcome === "accepted") {
          showToast && showToast("Installation en cours…", "success");
        }
      };

      return (
        <div style={S.card}>
          <h4 style={{ margin: "0 0 6px", fontSize: 15, fontWeight: 800 }}>📲 Installer MonTour</h4>
          <p style={{ margin: "0 0 12px", fontSize: 12.5, color: COLORS.textLight, lineHeight: 1.5 }}>
            Ajoutez MonTour à votre écran d'accueil pour y accéder comme une vraie application, même hors-ligne.
          </p>
          <button style={S.btn(COLORS.secondary)} onClick={handleClick}>⬇️ Télécharger / Installer l'application</button>

          {showIOSHelp && (
            <div style={{ marginTop: 12, padding: 12, background: "#f8fafc", borderRadius: 12, fontSize: 12.5, color: COLORS.text, lineHeight: 1.6 }}>

              1. Appuyez sur l'icône <strong>Partager</strong> <span style={{ fontWeight: 900 }}>⬆️</span> de Safari<br />
              2. Choisissez <strong>« Sur l'écran d'accueil »</strong><br />
              3. Appuyez sur <strong>« Ajouter »</strong>
            </div>
          )}
        </div>
      );
    }

    function StatusBadge({ s }) {
      const map = { waiting: ["⏳ En attente", "#f59e0b"], called: ["🔔 Appelé au guichet", "#2563eb"], served: ["✅ Servi", "#10b981"], cancelled: ["❌ Annulé", "#ef4444"] };
      const [label, color] = map[s] || ["Inconnu", "#64748b"];
      return <span style={S.badge(color)}>{label}</span>;
    }

    // ============================================================
    // SCREENS
    // ============================================================

    // 1. Splash Screen
    function SplashScreen({ onNavigate }) {
      return (
        <div style={{ minHeight: "100%", background: "linear-gradient(165deg, #1e3a8a 0%, #2563eb 50%, #3b82f6 100%)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 32, color: "#fff", textAlign: "center" }}>
          <div style={{ width: 110, height: 110, background: "rgba(255,255,255,0.18)", borderRadius: 30, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", marginBottom: 20, backdropFilter: "blur(12px)", border: "2px solid rgba(255,255,255,0.3)" }}>
            <span style={{ fontSize: 48 }}>🎫</span>
          </div>

        </div>
      );
    }

    // 1bis. Bandeau d'installation affiché tant que l'app n'a pas été installée
    function InstallBanner() {
      const [visible, setVisible] = useState(!window.__mtIsStandalone);
      const [canPrompt, setCanPrompt] = useState(!!window.__mtDeferredInstallPrompt || isIOS());

      useEffect(() => {
        const onAvailable = () => setCanPrompt(true);
        const onDone = () => setVisible(false);
        window.addEventListener("mt-install-available", onAvailable);
        window.addEventListener("mt-install-done", onDone);
        return () => {
          window.removeEventListener("mt-install-available", onAvailable);
          window.removeEventListener("mt-install-done", onDone);
        };
      }, []);

      if (!visible || !canPrompt) return null;

      const handleClick = async () => {
        if (isIOS()) return;
        const choice = await window.__mtTriggerInstall();
        if (choice.outcome === "accepted") setVisible(false);
      };

      return (
        <button onClick={handleClick} style={{ marginTop: 14, background: "rgba(255,255,255,0.15)", border: "1.5px solid rgba(255,255,255,0.4)", color: "#fff", borderRadius: 30, padding: "8px 18px", fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}>
          📲 {isIOS() ? "Ajouter à l'écran d'accueil" : "Installer l'application"}
        </button>
      );
    }

    // 2. Login Screen
    function LoginPage({ onNavigate, onLogin, showToast }) {
      const [form, setForm] = useState({ email: "", password: "" });
      const [loading, setLoading] = useState(false);

      const handleLogin = () => {
        if (!form.email || !form.password) return showToast("Remplissez tous les champs", "error");
        setLoading(true);
        setTimeout(() => {
          const user = localDB.users.find(u => u.email === form.email);
          if (!user || user.password !== form.password) {
            showToast("Identifiants incorrects", "error");
            setLoading(false);
            return;
          }
          showToast("Bienvenue sur MonTour !", "success");
          onLogin(user);
          setLoading(false);
        }, 500);
      };

      const demoLogin = (role) => {
        const demos = {
          user: { id: "u-1", username: "Ismaïla OROU KARGA", email: "oroukarga@gmail.com", password: "user1234", role: "user", priority: "normal", phone: "+229 96123456" },
          senior: { id: "u-2", username: "El-Hadj Adamou", email: "senior@montour.bj", password: "senior1234", role: "user", priority: "senior", phone: "+229 97112233" },
          agent: { id: "u-agent", username: "Agent Guichet Ségbana", email: "agent@montour.bj", password: "agent1234", role: "agent", priority: "normal", phone: "+229 97000002" },
          admin: { id: "u-admin", username: "Administrateur MonTour", email: "admin@montour.bj", password: "admin1234", role: "admin", priority: "normal", phone: "+229 97000001" },
        };
        const u = demos[role];
        if (!localDB.users.find(x => x.id === u.id)) { localDB.users.push(u); saveDB(); }

      };

      return (
        <div style={{ padding: 24, paddingTop: 40, minHeight: "100%", background: COLORS.bg }}>
          <div style={{ textAlign: "center", marginBottom: 28 }}>
            <span style={{ fontSize: 44 }}>🎫</span>
            <h2 style={{ fontSize: 26, fontWeight: 900, color: COLORS.text, marginTop: 8 }}>Connexion</h2>
            <p style={{ color: COLORS.textLight, fontSize: 14 }}>Accédez à votre espace MonTour</p>
          </div>

          <div style={S.card}>
            <div style={{ marginBottom: 16 }}>
              <label style={S.label}>Email</label>
              <input style={S.input} type="email" placeholder="nom@exemple.bj" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} />
            </div>
            <div style={{ marginBottom: 20 }}>
              <label style={S.label}>Mot de passe</label>

    // 5. Virtual Queue Screen & Ticket Booking
    function QueuePage({ user, serviceId, showToast }) {
      const [selectedId, setSelectedId] = useState(serviceId || SERVICES[0].id);
      const service = SERVICES.find(s => s.id === selectedId) || SERVICES[0];
      const [queueData, setQueueData] = useState({ tickets: [], status: "open" });
      const [myTicket, setMyTicket] = useState(null);

      const reloadQueue = useCallback(() => {
        const q = localDB.queues[service.id] || { tickets: [], status: "open", currentNumber: 0, calledNumber: 0 };
        setQueueData(q);
        const mine = (localDB.tickets || []).find(t => t.serviceId === service.id && t.userId === user.id && (t.status === "waiting" || t.status === "called"));
        setMyTicket(mine || null);
      }, [service.id, user.id]);

      useEffect(() => { reloadQueue(); }, [reloadQueue]);

      const takeTicket = () => {
        const q = localDB.queues[service.id];
        if (q.status !== "open") return showToast("Cette file d'attente est fermée", "error");
        if (myTicket) return showToast("Vous avez déjà un ticket actif dans ce service", "error");

        const num = q.currentNumber + 1;
        q.currentNumber = num;

        const waitingCount = q.tickets.filter(t => t.status === "waiting").length + 1;
        const estimated = predictWaitTime(service.id, waitingCount, user.priority);
        const score = computePriorityScore(user.priority, new Date().toISOString());

        const ticket = {
          id: `t-${Date.now()}`,
          number: num,
          serviceId: service.id,
          userId: user.id,
          userName: user.username,
          priority: user.priority,
          priorityScore: score,
          status: "waiting",
          estimatedWait: estimated,
          requestedAt: new Date().toISOString(),
        };

        q.tickets.push(ticket);
        localDB.tickets.push(ticket);

        // Notification Push
        if (!localDB.notifications[user.id]) localDB.notifications[user.id] = [];
        localDB.notifications[user.id].unshift({
          id: `n-${Date.now()}`,
          type: "ticket_taken",
          title: "🎫 Ticket réservé !",
          message: `Ticket n°${num} confirmé pour ${service.name}. Temps estimé par l'IA : ~${estimated} min.`,
          read: false,
          createdAt: new Date().toISOString(),
        });

        saveDB();
        showToast(`Ticket n°${num} obtenu avec succès !`, "success");
        reloadQueue();
      };

      const cancelTicket = (tId) => {
        const t = localDB.tickets.find(x => x.id === tId);
        if (t) t.status = "cancelled";
        const q = localDB.queues[service.id];
        if (q) {
          const qt = q.tickets.find(x => x.id === tId);
          if (qt) qt.status = "cancelled";
        }
        saveDB();
        showToast("Ticket annulé", "info");
        reloadQueue();
      };

      const waitingTickets = queueData.tickets.filter(t => t.status === "waiting")
        .sort((a, b) => b.priorityScore - a.priorityScore);

      return (
        <div style={{ padding: 20, paddingBottom: 24 }}>
          <h3 style={{ margin: "0 0 16px", fontSize: 22, fontWeight: 900 }}>File d'attente virtuelle</h3>

          {/* Service Selector Tabs */}
          <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 8, marginBottom: 16 }}>
            {SERVICES.map(s => (
              <button key={s.id} style={{ ...S.btnOutline(selectedId === s.id ? COLORS.primary : COLORS.textLight), padding: "8px 14px", borderRadius: 20, fontSize: 13, whiteSpace: "nowrap", background: selectedId === s.id ? COLORS.primary + "15" : "transparent" }} onClick={() => setSelectedId(s.id)}>
                {s.icon} {s.name.split(" ")[0]}
              </button>
            ))}
          </div>

          {/* Service Card Detail */}
          <div style={S.card}>
            <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 12 }}>
              <div style={{ width: 52, height: 52, borderRadius: 16, background: service.color + "18", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 28 }}>{service.icon}</div>
              <div>
                <h3 style={{ margin: 0, fontSize: 18, fontWeight: 800 }}>{service.name}</h3>
                <p style={{ margin: "2px 0 0", fontSize: 12, color: COLORS.textLight }}>📍 {service.address}</p>
              </div>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, background: "#f8fafc", padding: 12, borderRadius: 14, textAlign: "center", marginBottom: 16 }}>
              <div><span style={{ fontSize: 11, color: COLORS.textLight, fontWeight: 700 }}>STATUT</span><p style={{ margin: "2px 0 0", fontSize: 14, fontWeight: 800, color: queueData.status === "open" ? COLORS.secondary : COLORS.danger }}>{queueData.status === "open" ? "OUVERT" : "FERMÉ"}</p></div>
              <div><span style={{ fontSize: 11, color: COLORS.textLight, fontWeight: 700 }}>EN ATTENTE</span><p style={{ margin: "2px 0 0", fontSize: 14, fontWeight: 800 }}>{waitingTickets.length} usagers</p></div>
              <div><span style={{ fontSize: 11, color: COLORS.textLight, fontWeight: 700 }}>DERNIER APPEL</span><p style={{ margin: "2px 0 0", fontSize: 14, fontWeight: 800, color: COLORS.primary }}>#{queueData.calledNumber || "-"}</p></div>
            </div>

            {myTicket ? (
              <div style={{ background: "#eff6ff", border: `1.5px solid ${COLORS.primary}`, padding: 16, borderRadius: 16, textAlign: "center" }}>
                <p style={{ margin: 0, fontSize: 12, fontWeight: 800, color: COLORS.primary }}>VOTRE TICKET EN COURS</p>
                <h1 style={{ fontSize: 42, fontWeight: 900, color: COLORS.text, margin: "4px 0" }}>N° {myTicket.number}</h1>
                <p style={{ margin: 0, fontSize: 13, color: COLORS.textLight }}>Temps estimé par l'IA : <strong style={{ color: COLORS.accent }}>~{myTicket.estimatedWait} min</strong></p>
                <button style={{ ...S.btnOutline(COLORS.danger), marginTop: 12, padding: "8px 16px", fontSize: 13 }} onClick={() => cancelTicket(myTicket.id)}>Annuler mon ticket</button>
              </div>
            ) : (
              <button style={S.btn()} onClick={takeTicket} disabled={queueData.status !== "open"}>🎫 Prendre un ticket maintenant</button>
            )}
          </div>

          {/* Live Queue Ranking */}
          <div style={S.card}>
            <h4 style={{ margin: "0 0 14px", fontSize: 15, fontWeight: 800 }}>Ordre de passage dynamique (Moteur de Priorités IA)</h4>
            {waitingTickets.length === 0 ? (
              <p style={{ color: COLORS.textLight, fontSize: 13, textAlign: "center", padding: "12px 0" }}>Aucun ticket en attente dans cette file.</p>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {waitingTickets.map((t, idx) => (
                  <div key={t.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 12px", background: t.userId === user.id ? "#eff6ff" : "#f8fafc", borderRadius: 12, border: t.userId === user.id ? `1.5px solid ${COLORS.primary}` : "none" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span style={{ width: 26, height: 26, borderRadius: "50%", background: idx === 0 ? COLORS.accent : COLORS.border, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 800 }}>{idx + 1}</span>
                      <div>
                        <span style={{ fontWeight: 800, fontSize: 15 }}>Ticket #{t.number}</span>
                        <p style={{ margin: 0, fontSize: 11, color: COLORS.textLight }}>{t.userName} {t.userId === user.id && "(Vous)"}</p>
                      </div>
                    </div>
                    <div style={{ textAlign: "right" }}>
                      <PriorityBadge p={t.priority} />
                      <p style={{ margin: "2px 0 0", fontSize: 11, color: COLORS.textLight, fontWeight: 600 }}>Score: {t.priorityScore}</p>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

      return (
        <div style={{ padding: 20, paddingBottom: 24 }}>
          <h3 style={{ margin: "0 0 16px", fontSize: 22, fontWeight: 900 }}>Profil Utilisateur</h3>
          <div style={{ ...S.card, textAlign: "center", padding: 24 }}>
            <div style={{ width: 70, height: 70, borderRadius: "50%", background: COLORS.primary, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 32, fontWeight: 800, margin: "0 auto 12px" }}>{user.username[0]}</div>
            <h3 style={{ margin: 0, fontSize: 20, fontWeight: 800 }}>{user.username}</h3>
            <p style={{ margin: "2px 0 10px", color: COLORS.textLight, fontSize: 13 }}>{user.email}</p>
            <PriorityBadge p={user.priority} />
          </div>

          <div style={S.card}>
            <h4 style={{ margin: "0 0 12px", fontSize: 15, fontWeight: 800 }}>Modifier ma catégorie de priorité</h4>
            <select style={{ ...S.input, marginBottom: 14 }} value={prio} onChange={e => setPrio(e.target.value)}>
              <option value="normal">👤 Usager Normal (Score base 40)</option>
              <option value="senior">👴 Senior / 60+ ans (Score base 60)</option>
              <option value="handicap">♿ Personne Handicapée (Score base 80)</option>
              <option value="urgent">🚨 Urgence Médicale (Score base 100)</option>
            </select>
            <button style={S.btn()} onClick={savePrio}>Enregistrer les modifications</button>
          </div>

          <InstallAppButton showToast={showToast} />

          <button style={{ ...S.btnOutline(COLORS.danger), marginTop: 10 }} onClick={onLogout}>Déconnexion</button>
        </div>
      );
    }

    // 10. Agent & Admin Management Dashboard
    function AdminPage({ user, showToast, onLogout }) {
      const [selectedService, setSelectedService] = useState(SERVICES[0].id);
      const service = SERVICES.find(s => s.id === selectedService) || SERVICES[0];
      const q = localDB.queues[service.id] || { tickets: [], status: "open", calledNumber: 0 };
      const [refresh, setRefresh] = useState(0);

      const callNext = () => {
        const waiting = q.tickets.filter(t => t.status === "waiting").sort((a, b) => b.priorityScore - a.priorityScore);
        if (waiting.length === 0) return showToast("Aucun ticket en attente dans cette file", "error");

        const next = waiting[0];
        next.status = "called";
        q.calledNumber = next.number;

        // Notify User
        if (!localDB.notifications[next.userId]) localDB.notifications[next.userId] = [];
        localDB.notifications[next.userId].unshift({
          id: `n-${Date.now()}`,
          type: "your_turn",
          title: "🔔 VOTRE TOUR APPROCHE !",
          message: `Ticket n°${next.number} — Présentez-vous immédiatement au guichet de ${service.name}.`,
          read: false,
          createdAt: new Date().toISOString(),
        });

        saveDB();
        showToast(`Ticket n°${next.number} (${next.userName}) appelé au guichet !`, "success");
        setRefresh(r => r + 1);
      };

      const toggleQueue = () => {
        q.status = q.status === "open" ? "closed" : "open";
        saveDB();
        showToast(`File ${q.status === "open" ? "ouverte" : "fermée"} !`, "info");
        setRefresh(r => r + 1);
      };

      const waiting = q.tickets.filter(t => t.status === "waiting");

      return (
        <div style={{ padding: 20, paddingBottom: 24 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <h3 style={{ margin: 0, fontSize: 22, fontWeight: 900 }}>Espace Guichet / Admin</h3>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={S.badge(COLORS.primary)}>{user.role.toUpperCase()}</span>
              <button style={{ background: "none", border: "none", cursor: "pointer", fontSize: 20 }} onClick={onLogout} title="Déconnexion">🚪</button>
            </div>
          </div>

          {/* Select Service */}
          <div style={{ marginBottom: 14 }}>
            <label style={S.label}>Guichet / Service à gérer</label>
            <select style={S.input} value={selectedService} onChange={e => setSelectedService(e.target.value)}>
              {SERVICES.map(s => <option key={s.id} value={s.id}>{s.icon} {s.name}</option>)}
            </select>
          </div>

          {/* Controls */}
          <div style={S.card}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <div>
                <h4 style={{ margin: 0, fontSize: 16, fontWeight: 800 }}>{service.name}</h4>
                <p style={{ margin: "2px 0 0", fontSize: 12, color: COLORS.textLight }}>Dernier appelé : <strong style={{ color: COLORS.primary }}>#{q.calledNumber || "-"}</strong></p>
              </div>
              <button style={{ ...S.btnOutline(q.status === "open" ? COLORS.danger : COLORS.secondary), width: "auto", padding: "6px 14px", fontSize: 12 }} onClick={toggleQueue}>
                {q.status === "open" ? "Fermer la file" : "Ouvrir la file"}
              </button>
            </div>

            <button style={{ ...S.btn(COLORS.secondary), padding: "16px", fontSize: 16 }} onClick={callNext} disabled={q.status !== "open" || waiting.length === 0}>
              📢 APPELER LE PROCHAIN TICKET (IA)
            </button>
          </div>

          {/* Queue List */}
          <div style={S.card}>
            <h4 style={{ margin: "0 0 12px", fontSize: 15, fontWeight: 800 }}>File d'attente ({waiting.length} en attente)</h4>
            {waiting.length === 0 ? (
              <p style={{ color: COLORS.textLight, fontSize: 13, textAlign: "center" }}>La file est vide.</p>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {waiting.sort((a, b) => b.priorityScore - a.priorityScore).map(t => (
                  <div key={t.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 12px", background: "#f8fafc", borderRadius: 12 }}>
                    <div>
                      <span style={{ fontWeight: 800, fontSize: 15 }}>Ticket #{t.number}</span>
                      <p style={{ margin: 0, fontSize: 11, color: COLORS.textLight }}>{t.userName}</p>
                    </div>
                    <PriorityBadge p={t.priority} />
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // Navigation Bar Component
    function NavBar({ active, onNavigate, user, unread }) {
      const isAdminOrAgent = user?.role === "admin" || user?.role === "agent";
      const items = [
        { id: "home", icon: "🏠", label: "Accueil" },
        { id: "queue", icon: "🎫", label: "File" },
        { id: "tickets", icon: "📋", label: "Tickets" },
        { id: "chatbot", icon: "🤖", label: "Assistant" },
        ...(isAdminOrAgent ? [{ id: "admin", icon: "⚙️", label: "Guichet" }] : []),
        { id: "profile", icon: "👤", label: "Profil" },
      ];

      return (
        <nav style={S.navBar}>
          {items.map(item => (
            <button key={item.id} style={S.navItem(active === item.id)} onClick={() => onNavigate(item.id)}>
              <span style={{ fontSize: 20 }}>{item.icon}</span>
              <span style={{ fontSize: 10, marginTop: 2, maxWidth: "100%", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.label}</span>
            </button>
          ))}
        </nav>
      );
    }

    // Root Component
    function App() {
      const [page, setPage] = useState("splash");
      const [user, setUser] = useState(null);
      const [params, setParams] = useState({});
      const [toast, setToast] = useState({ msg: "", type: "info" });

      const showToast = useCallback((msg, type = "info") => setToast({ msg, type }), []);
      const navigate = useCallback((to, p = {}) => { setPage(to); setParams(p); }, []);

      const handleLogin = (u) => { setUser(u); navigate("home"); };
      const handleLogout = () => { setUser(null); navigate("splash"); };

      const renderPage = () => {
        if (page === "splash") return <SplashScreen onNavigate={navigate} />;
        if (page === "login") return <LoginPage onNavigate={navigate} onLogin={handleLogin} showToast={showToast} />;
        if (page === "register") return <RegisterPage onNavigate={navigate} onLogin={handleLogin} showToast={showToast} />;
        if (!user) return <LoginPage onNavigate={navigate} onLogin={handleLogin} showToast={showToast} />;

        switch (page) {
          case "home": return <DashboardPage user={user} onNavigate={navigate} showToast={showToast} onLogout={handleLogout} />;
          case "queue": return <QueuePage user={user} serviceId={params.serviceId} showToast={showToast} />;
          case "tickets": return <MyTicketsPage user={user} />;
          case "chatbot": return <ChatbotPage user={user} />;
          case "notifications": return <NotificationsPage user={user} showToast={showToast} />;
          case "profile": return <ProfilePage user={user} onUpdate={u => setUser(u)} onLogout={handleLogout} showToast={showToast} />;
          case "admin": return <AdminPage user={user} showToast={showToast} onLogout={handleLogout} />;
          default: return <DashboardPage user={user} onNavigate={navigate} showToast={showToast} />;
        }
      };

      const showNav = user && !["splash", "login", "register"].includes(page);

      return (
        <div style={S.app}>
          <Toast msg={toast.msg} type={toast.type} onClose={() => setToast({ msg: "", type: "info" })} />
          <main style={{ flex: 1, minHeight: 0, overflowY: "auto", overflowX: "hidden", WebkitOverflowScrolling: "touch" }}>{renderPage()}</main>
          {showNav && <NavBar active={page} onNavigate={navigate} user={user} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    {% endverbatim %}
  </script>

</body>

</html>
